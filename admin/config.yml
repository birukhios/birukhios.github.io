# Sveltia CMS configuration
# Login is GitHub OAuth — your GitHub account is the credential. No password is
# stored anywhere in this repo.
backend:
  name: github
  repo: birukhios/birukhios.github.io
  branch: main
  # No `base_url` / OAuth proxy needed: sign in with a GitHub Personal Access
  # Token via "Sign In Using Access Token". The token lives only in your
  # browser's local storage — it is never committed to this repo.
  # See admin/SETUP.md.

# Images uploaded through the CMS land here
media_folder: uploads/cms
public_folder: /uploads/cms

publish_mode: simple
site_url: https://birukhios.github.io

collections:
  # ── Case studies ────────────────────────────────────────────────────────
  - name: projects
    label: Case Studies
    files:
      - name: projects
        label: All case studies
        file: content/projects.json
        description: The Selected Work cards and their full case-study pages.
        fields:
          - name: items
            label: Case studies
            widget: list
            label_singular: case study
            summary: '{{fields.name}} ({{fields.year}})'
            fields:
              - { name: id, label: ID (url slug), widget: string }
              - { name: name, label: Name, widget: string }
              - { name: year, label: Year, widget: string }
              - { name: kind, label: Kind, widget: string }
              - { name: group, label: Group, widget: select, options: [work, play], default: work }
              - { name: blurb, label: Card blurb, widget: text }
              - { name: summary, label: Summary, widget: text }
              - { name: problem, label: The problem, widget: text }
              - { name: solve, label: How I solved it, widget: text }
              - { name: projectType, label: Project type, widget: string, required: false }
              - { name: role, label: My role, widget: string, required: false }
              - { name: platform, label: Platform, widget: string, required: false }
              - { name: status, label: Status, widget: string, required: false }
              - { name: figma, label: Figma URL, widget: string, required: false }
              - { name: swatch, label: Accent swatch (hex), widget: string, required: false }
              - { name: coverTitle, label: Cover title, widget: string, required: false }
              - { name: coverLine, label: Cover line, widget: string, required: false }
              - { name: cover, label: Cover image, widget: image, required: false }
              - { name: shots, label: Card thumbnails (3), widget: list, field: { name: src, label: Image, widget: image }, required: false }
              - { name: meta, label: Tags, widget: list, field: { name: tag, label: Tag, widget: string }, required: false }
              - { name: did, label: What I did (bullets), widget: list, field: { name: item, label: Bullet, widget: text }, required: false }
              - name: sections
                label: Case-study sections
                widget: list
                required: false
                label_singular: section
                summary: '{{fields.label}} — {{fields.title}}'
                fields:
                  - { name: label, label: Kicker, widget: string }
                  - { name: title, label: Heading, widget: string }
                  - { name: paras, label: Paragraphs, widget: list, field: { name: text, label: Paragraph, widget: text }, required: false }
                  - name: points
                    label: Side points
                    widget: list
                    required: false
                    fields:
                      - { name: head, label: Heading, widget: string }
                      - { name: body, label: Body, widget: text }
                  - name: images
                    label: Images
                    widget: list
                    required: false
                    fields:
                      - { name: src, label: Image, widget: image }
                      - { name: cap, label: Caption, widget: string, required: false }
                      - { name: wide, label: Full width, widget: boolean, required: false, default: true }
                  - name: tradeoffs
                    label: Tradeoffs
                    widget: list
                    required: false
                    fields:
                      - { name: old, label: The version I didn't ship, widget: text }
                      - { name: now, label: Why it shipped this way, widget: text }

  # ── Play ────────────────────────────────────────────────────────────────
  - name: play
    label: Play
    files:
      - name: mood
        label: Moodboard
        file: content/mood.json
        fields:
          - name: items
            label: Pieces
            widget: list
            label_singular: piece
            summary: '{{fields.title}}'
            fields:
              - { name: src, label: Image, widget: image }
              - { name: title, label: Title, widget: string }
              - { name: note, label: Note, widget: text }
              - { name: ar, label: Aspect ratio, widget: string, required: false, hint: 'e.g. 16 / 10' }
      - name: branding
        label: Branding (Sorenie)
        file: content/branding.json
        fields:
          - name: items
            label: Pieces
            widget: list
            label_singular: piece
            summary: '{{fields.title}}'
            fields:
              - { name: src, label: Image, widget: image }
              - { name: title, label: Title, widget: string }
              - { name: note, label: Note, widget: text }
      - name: posters
        label: Posters
        file: content/posters.json
        fields:
          - name: items
            label: Posters
            widget: list
            label_singular: poster
            summary: '{{fields.title}}'
            fields:
              - { name: src, label: Image, widget: image }
              - { name: title, label: Title, widget: string }
              - { name: note, label: Note, widget: text, required: false }
      - name: sites
        label: Client sites
        file: content/sites.json
        fields:
          - name: items
            label: Sites
            widget: list
            label_singular: site
            summary: '{{fields.name}}'
            fields:
              - { name: name, label: Name, widget: string }
              - { name: year, label: Year, widget: string }
              - { name: kind, label: Kind, widget: string }
              - { name: cover, label: Cover image, widget: image, required: false }
              - { name: note, label: Note, widget: text }
              - { name: live, label: Live URL, widget: string, required: false }

  # ── About / Resume ──────────────────────────────────────────────────────
  - name: about
    label: About & Resume
    files:
      - name: experience
        label: Experience
        file: content/experience.json
        fields:
          - name: items
            label: Roles
            widget: list
            label_singular: role
            summary: '{{fields.org}} — {{fields.title}}'
            fields:
              - { name: org, label: Organisation, widget: string }
              - { name: title, label: Job title, widget: string }
              - { name: when, label: Dates, widget: string }
              - { name: place, label: Location, widget: string, required: false }
              - { name: note, label: Short note, widget: text, required: false }
              - { name: points, label: Bullets, widget: list, field: { name: item, label: Bullet, widget: text }, required: false }
      - name: education
        label: Education & certificates
        file: content/education.json
        fields:
          - name: items
            label: Entries
            widget: list
            label_singular: entry
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: Title, widget: string }
              - { name: institution, label: Institution, widget: string }
              - { name: year, label: Year, widget: string }
              - { name: note, label: Note, widget: text, required: false }
      - name: services
        label: How I can help
        file: content/services.json
        fields:
          - name: items
            label: Services
            widget: list
            label_singular: service
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: text }
      - name: process
        label: How I work
        file: content/process.json
        fields:
          - name: items
            label: Steps
            widget: list
            label_singular: step
            summary: '{{fields.n}} — {{fields.title}}'
            fields:
              - { name: n, label: Number, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: text }
