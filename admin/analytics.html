<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Analytics — Portfolio CMS</title>
  <!-- Analytics now lives inside the CMS shell as a tab. This page is kept so
       existing links and bookmarks keep working; it forwards, preserving
       ?demo=1 if present. -->

    location.replace('./#/analytics' + (/[?&]demo=1/.test(location.search) ? '?demo=1' : ''));
  </script>
</head>
<body>
  <p style="font-family:system-ui;padding:24px">
    Moved into the CMS — <a href="./#/analytics">open Analytics</a>.
  </p>
</body>
</html>
